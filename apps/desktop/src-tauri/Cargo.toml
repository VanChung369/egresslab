[package]
name = "egresslab"
version = "0.1.0"
description = "EgressLab - Network Routing & Proxy Studio"
authors = ["EgressLab contributors"]
edition = "2021"
links = "egresslab"

[lib]
name = "egresslab_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
