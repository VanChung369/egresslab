name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: Go (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [services/controller, services/network-agent]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.mod

      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "Run gofmt -w on:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: go vet (every target platform)
        run: |
          for target in windows/amd64 windows/arm64 darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            echo "== $target"
            GOOS="${target%/*}" GOARCH="${target#*/}" go vet ./...
          done

  controller-cross-platform:
    name: Controller (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple Silicon (arm64). Windows runs the real DPAPI key store tests;
        # the macOS Keychain test is opt-in (EGRESSLAB_TEST_KEYCHAIN=1) and skipped here.
        os: [windows-latest, macos-latest]
    defaults:
      run:
        working-directory: services/controller
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: services/controller/go.mod
          cache-dependency-path: services/controller/go.mod

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -v ./...

  desktop:
    name: Desktop (SvelteKit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: apps/desktop/yarn.lock

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Prettier
        run: yarn format:check

      # "yarn check" is Yarn 1's lockfile check; "yarn run check" runs the package script.
      - name: svelte-check
        run: yarn run check
