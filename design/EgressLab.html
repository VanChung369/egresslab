<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EgressLab — Network Routing & Proxy Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;background:#0B1018}
a{color:#4DA8FF}a:hover{color:#7DBFFF}
</style>
<style>
/* ==========================================================================
   Egress Design Language — v1.0
   Tokens + components for EgressLab · Network Routing & Proxy Studio
   ========================================================================== */

.e-root {
  --font: "Geist", "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;

  /* surfaces */
  --bg: #0B1018; --sidebar: #101722; --surface: #151E2B; --elev: #1B2736; --sunken: #0E141E;
  --border: #293749; --border-2: #34465C;
  --hover: rgba(148,163,184,.07); --press: rgba(148,163,184,.13);
  /* ink */
  --text: #EAF0F7; --text-2: #94A3B8; --muted: #7C8BA1;
  /* accent + semantic */
  --accent: #4DA8FF; --accent-ink: #06121F; --accent-bg: rgba(77,168,255,.12); --accent-line: rgba(77,168,255,.42);
  --ok: #35C995; --ok-bg: rgba(53,201,149,.11); --ok-line: rgba(53,201,149,.34);
  --warn: #F3B75E; --warn-bg: rgba(243,183,94,.11); --warn-line: rgba(243,183,94,.36);
  --crit: #EF6973; --crit-bg: rgba(239,105,115,.11); --crit-line: rgba(239,105,115,.40);
  --info: #A49BFF; --info-bg: rgba(164,155,255,.12); --info-line: rgba(164,155,255,.38);
  --idle-bg: rgba(124,139,161,.12);
  /* data series (validated pair, dark surface) */
  --s-rx: #3D8FEA; --s-tx: #CC6496;
  --grid: rgba(148,163,184,.10);
  --shadow: 0 1px 0 rgba(0,0,0,.25), 0 16px 40px rgba(0,0,0,.42);
  --scrim: rgba(4,8,14,.62);
  --focus: 0 0 0 2px var(--bg), 0 0 0 4px var(--accent);
  color-scheme: dark;
  font-family: var(--font); font-size: 13px; line-height: 20px; color: var(--text); background: var(--bg);
  -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "ss01", "cv11";
}
.e-root.e-light {
  --bg: #F3F5F8; --sidebar: #EAEEF3; --surface: #FFFFFF; --elev: #F6F8FB; --sunken: #EEF1F5;
  --border: #D9E0E8; --border-2: #C6D0DB;
  --hover: rgba(30,52,82,.05); --press: rgba(30,52,82,.09);
  --text: #0E1621; --text-2: #44536A; --muted: #5E6D82;
  --accent: #1F6FD1; --accent-ink: #FFFFFF; --accent-bg: rgba(31,111,209,.09); --accent-line: rgba(31,111,209,.38);
  --ok: #0B7F59; --ok-bg: rgba(11,127,89,.08); --ok-line: rgba(11,127,89,.32);
  --warn: #9A5B00; --warn-bg: rgba(196,124,0,.10); --warn-line: rgba(154,91,0,.32);
  --crit: #C23543; --crit-bg: rgba(194,53,67,.08); --crit-line: rgba(194,53,67,.34);
  --info: #5E4FD0; --info-bg: rgba(94,79,208,.08); --info-line: rgba(94,79,208,.32);
  --idle-bg: rgba(68,83,106,.08);
  --s-rx: #2A78D6; --s-tx: #C2477F;
  --grid: rgba(30,52,82,.08);
  --shadow: 0 1px 0 rgba(15,23,34,.04), 0 16px 40px rgba(15,23,34,.14);
  --scrim: rgba(14,22,33,.38);
  color-scheme: light;
}
.e-root *, .e-root *::before, .e-root *::after { box-sizing: border-box; }
.e-root button, .e-root input, .e-root select, .e-root textarea { font: inherit; color: inherit; }
.e-root :focus { outline: none; }
.e-root :focus-visible { outline: none; box-shadow: var(--focus); }
.e-root ::selection { background: var(--accent-bg); }
.e-root a { color: var(--accent); text-decoration: none; }
.e-root a:hover { text-decoration: underline; }
.e-root h1, .e-root h2, .e-root h3, .e-root h4, .e-root p { margin: 0; }
.e-root ::-webkit-scrollbar { width: 10px; height: 10px; }
.e-root ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }
.e-root ::-webkit-scrollbar-track { background: transparent; }

/* ---------- type ---------- */
.e-h1 { font-size: 26px; line-height: 32px; font-weight: 600; letter-spacing: -.018em; }
.e-h2 { font-size: 18px; line-height: 26px; font-weight: 600; letter-spacing: -.01em; }
.e-h3 { font-size: 15px; line-height: 22px; font-weight: 600; }
.e-body { font-size: 14px; line-height: 22px; }
.e-sub { color: var(--text-2); }
.e-label { font-size: 12px; line-height: 16px; font-weight: 500; color: var(--text-2); }
.e-cap { font-size: 11.5px; line-height: 16px; color: var(--muted); }
.e-over { font-size: 11px; line-height: 16px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.e-metric { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -.025em; font-variant-numeric: tabular-nums; }
.e-mono { font-family: var(--mono); font-size: 12.5px; font-variant-ligatures: none; letter-spacing: -.01em; }
.e-mono-s { font-family: var(--mono); font-size: 11.5px; font-variant-ligatures: none; }
.e-num { font-variant-numeric: tabular-nums; }
.e-2 { color: var(--text-2); }
.e-m { color: var(--muted); }
.c-ok { color: var(--ok); } .c-warn { color: var(--warn); } .c-crit { color: var(--crit); } .c-info { color: var(--info); } .c-accent { color: var(--accent); }
.e-trunc { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

/* ---------- icons ---------- */
.ic { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.ic-12 { width: 12px; height: 12px; stroke-width: 2.1; }
.ic-14 { width: 14px; height: 14px; stroke-width: 1.9; }
.ic-18 { width: 18px; height: 18px; }
.ic-20 { width: 20px; height: 20px; stroke-width: 1.6; }
.ic-24 { width: 24px; height: 24px; stroke-width: 1.5; }
.ic-spin { animation: e-spin 1s linear infinite; }

/* ---------- app shell ---------- */
.e-app { display: flex; height: 100vh; min-height: 640px; overflow: hidden; background: var(--bg); }
.e-side { width: 248px; flex: 0 0 248px; background: var(--sidebar); border-right: 1px solid var(--border); display: flex; flex-direction: column; min-height: 0; }
.e-side-scroll { flex: 1 1 auto; overflow: auto; min-height: 0; }
.e-main { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; min-height: 0; position: relative; }
.e-top { height: 56px; flex: 0 0 56px; display: flex; align-items: center; gap: 12px; padding: 0 20px 0 24px; border-bottom: 1px solid var(--border); background: var(--bg); }
.e-content { flex: 1 1 auto; overflow: auto; min-height: 0; }
.e-page { padding: 24px 28px 48px; max-width: 1680px; display: flex; flex-direction: column; gap: 20px; }
.e-page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
@media (max-width: 1240px) { .e-side { width: 216px; flex-basis: 216px; } .e-page { padding: 20px 20px 40px; } }
@media (max-width: 760px) { .e-app { flex-direction: column; height: auto; overflow: visible; } .e-side { width: auto; flex: none; border-right: 0; border-bottom: 1px solid var(--border); } .e-content { overflow: visible; } }

.e-brand { display: flex; align-items: center; gap: 10px; padding: 16px 16px 12px; }
.e-brand-mark { width: 28px; height: 28px; border-radius: 8px; background: var(--elev); border: 1px solid var(--border-2); display: grid; place-items: center; color: var(--accent); flex: none; }
.e-brand-name { font-size: 15px; font-weight: 650; letter-spacing: -.01em; line-height: 18px; }
.e-ws { margin: 0 12px; display: flex; align-items: center; gap: 10px; width: calc(100% - 24px); padding: 8px 10px; border-radius: 9px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; text-align: left; }
.e-ws:hover { border-color: var(--border-2); }
.e-ws-av { width: 24px; height: 24px; border-radius: 6px; background: var(--info-bg); color: var(--info); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; }
.e-env { margin: 8px 12px 4px; display: flex; align-items: center; gap: 8px; padding: 6px 10px; border-radius: 8px; font-size: 12px; color: var(--text-2); }
.e-nav { display: flex; flex-direction: column; gap: 1px; padding: 4px 12px; }
.e-nav-label { padding: 14px 10px 6px; }
.e-nav-item { display: flex; align-items: center; gap: 10px; height: 34px; padding: 0 10px; border-radius: 7px; border: 0; background: transparent; color: var(--text-2); font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; width: 100%; }
.e-nav-item:hover { background: var(--hover); color: var(--text); }
.e-nav-item.is-on { background: var(--elev); color: var(--text); box-shadow: inset 0 0 0 1px var(--border); }
.e-nav-item.is-on .ic { color: var(--accent); }
.e-nav-count { margin-left: auto; font-family: var(--mono); font-size: 11px; color: var(--muted); }
.e-nav-count.is-crit { color: var(--crit); }
.e-nav-count.is-warn { color: var(--warn); }
.e-side-foot { border-top: 1px solid var(--border); padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 1px; }
.e-user { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; margin-top: 6px; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; }
.e-user:hover { background: var(--hover); }
.e-av { width: 28px; height: 28px; border-radius: 50%; background: var(--accent-bg); color: var(--accent); display: grid; place-items: center; font-size: 11px; font-weight: 700; flex: none; border: 1px solid var(--accent-line); }

.e-crumbs { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-2); min-width: 0; }
.e-crumbs b { color: var(--text); font-weight: 600; font-size: 14px; }
.e-cmdk { display: flex; align-items: center; gap: 8px; height: 34px; width: min(380px, 34vw); padding: 0 8px 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); color: var(--muted); cursor: pointer; text-align: left; }
.e-cmdk:hover { border-color: var(--border-2); color: var(--text-2); }
.e-health { display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 12px; font-weight: 500; }
.e-health:hover { border-color: var(--border-2); }

/* ---------- buttons ---------- */
.e-btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 32px; padding: 0 12px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--elev); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s, color .12s; text-decoration: none; }
.e-btn:hover { background: var(--press); border-color: var(--border-2); }
.e-btn:active { transform: translateY(.5px); }
.e-btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.e-btn-primary:hover { background: var(--accent); filter: brightness(1.08); }
.e-btn-ghost { background: transparent; border-color: transparent; color: var(--text-2); }
.e-btn-ghost:hover { background: var(--hover); color: var(--text); border-color: transparent; }
.e-btn-danger { background: var(--crit-bg); border-color: var(--crit-line); color: var(--crit); }
.e-btn-danger:hover { background: var(--crit-bg); filter: brightness(1.15); }
.e-btn-sm { height: 28px; padding: 0 10px; font-size: 12px; border-radius: 6px; }
.e-btn-xs { height: 24px; padding: 0 8px; font-size: 12px; border-radius: 6px; gap: 4px; }
.e-btn-lg { height: 38px; padding: 0 16px; font-size: 14px; }
.e-btn-icon { width: 32px; padding: 0; }
.e-btn-sm.e-btn-icon { width: 28px; }
.e-btn-xs.e-btn-icon { width: 24px; }
.e-btn:disabled, .e-btn[aria-disabled="true"] { opacity: .45; cursor: not-allowed; filter: none; transform: none; }
.e-btn-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.e-link { border: 0; background: transparent; padding: 0; color: var(--accent); font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; font-size: inherit; }
.e-link:hover { text-decoration: underline; }

/* ---------- inputs ---------- */
.e-field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.e-input, .e-select, .e-textarea { height: 32px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border-2); background: var(--sunken); color: var(--text); font-size: 13px; width: 100%; transition: border-color .12s; }
.e-input::placeholder, .e-textarea::placeholder { color: var(--muted); }
.e-input:hover, .e-select:hover { border-color: var(--muted); }
.e-input:focus, .e-select:focus, .e-textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.e-input.is-mono { font-family: var(--mono); font-size: 12.5px; }
.e-input.is-err { border-color: var(--crit); }
.e-input:disabled { opacity: .6; cursor: not-allowed; }
.e-textarea { height: auto; padding: 10px; font-family: var(--mono); font-size: 12px; line-height: 19px; resize: vertical; }
.e-select { appearance: none; -webkit-appearance: none; padding-right: 28px; cursor: pointer; }
.e-select-wrap { position: relative; display: inline-flex; min-width: 0; }
.e-select-wrap .ic { position: absolute; right: 8px; top: 50%; margin-top: -7px; color: var(--muted); pointer-events: none; }
.e-search { position: relative; display: flex; min-width: 0; }
.e-search > .ic { position: absolute; left: 10px; top: 50%; margin-top: -8px; color: var(--muted); pointer-events: none; }
.e-search .e-input { padding-left: 32px; }
.e-hint { font-size: 12px; color: var(--muted); line-height: 17px; }
.e-err { font-size: 12px; color: var(--crit); }
.e-check { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; margin: 0; }
.e-radio-dot { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--border-2); display: grid; place-items: center; flex: none; margin-top: 2px; }
.is-on > .e-radio-dot, .e-radio-dot.is-on { border-color: var(--accent); }
.is-on > .e-radio-dot::after, .e-radio-dot.is-on::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }

.e-switch { width: 34px; height: 20px; border-radius: 10px; background: var(--border-2); border: 0; position: relative; cursor: pointer; flex: none; padding: 0; transition: background .15s; }
.e-switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 14px; height: 14px; border-radius: 50%; background: #fff; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.e-switch.is-on { background: var(--accent); }
.e-switch.is-on::after { transform: translateX(14px); }
.e-switch.is-locked { cursor: not-allowed; opacity: .75; }

.e-seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--sunken); border: 1px solid var(--border); gap: 2px; flex-wrap: wrap; }
.e-seg button { height: 26px; padding: 0 10px; border: 0; border-radius: 6px; background: transparent; color: var(--text-2); font-size: 12px; font-weight: 500; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.e-seg button:hover { color: var(--text); }
.e-seg button.is-on { background: var(--elev); color: var(--text); box-shadow: 0 0 0 1px var(--border-2); }

.e-chip { display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--border); background: var(--surface); color: var(--text-2); font-size: 12px; font-weight: 500; cursor: pointer; white-space: nowrap; }
.e-chip:hover { border-color: var(--border-2); color: var(--text); }
.e-chip.is-on { border-color: var(--accent-line); background: var(--accent-bg); color: var(--text); }
.e-chip .e-chip-n { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* ---------- cards & layout ---------- */
.e-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; min-width: 0; }
.e-card-h { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--border); min-height: 52px; flex-wrap: wrap; }
.e-card-h.is-plain { border-bottom: 0; padding-bottom: 4px; }
.e-card-t { font-size: 15px; line-height: 22px; font-weight: 600; }
.e-card-b { padding: 16px; }
.e-card-f { padding: 10px 16px; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; }
.e-spacer { flex: 1 1 auto; }
.e-row { display: flex; align-items: center; gap: 8px; min-width: 0; }
.e-col { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.e-grid { display: grid; gap: 16px; }
.e-divider { height: 1px; background: var(--border); border: 0; margin: 0; }
.e-vdiv { width: 1px; align-self: stretch; background: var(--border); }
.e-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

.e-tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(190px, 100%), 1fr)); gap: 1px; background: var(--border); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.e-tile { background: var(--surface); padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 0; text-align: left; cursor: pointer; color: var(--text); }
.e-tile:hover { background: var(--elev); }
.e-tile-ctx { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-2); min-height: 18px; }

.e-kv { display: grid; grid-template-columns: minmax(120px, 34%) minmax(0, 1fr); gap: 9px 16px; font-size: 13px; margin: 0; align-items: baseline; }
.e-kv dt { color: var(--text-2); }
.e-kv dd { margin: 0; min-width: 0; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.e-sect { display: flex; flex-direction: column; gap: 12px; }
.e-sect-t { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 600; color: var(--text-2); letter-spacing: .02em; }

/* ---------- badges / tags ---------- */
.e-badge { display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 6px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; border: 1px solid transparent; line-height: 1; }
.e-badge .ic { width: 13px; height: 13px; stroke-width: 2.1; }
.s-ok { color: var(--ok); background: var(--ok-bg); border-color: var(--ok-line); }
.s-warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-line); }
.s-crit { color: var(--crit); background: var(--crit-bg); border-color: var(--crit-line); }
.s-info { color: var(--info); background: var(--info-bg); border-color: var(--info-line); }
.s-accent { color: var(--accent); background: var(--accent-bg); border-color: var(--accent-line); }
.s-idle { color: var(--text-2); background: var(--idle-bg); border-color: var(--border-2); }
.e-tag { display: inline-flex; align-items: center; gap: 4px; height: 20px; padding: 0 6px; border-radius: 5px; font-family: var(--mono); font-size: 11px; font-weight: 500; color: var(--text-2); background: var(--elev); border: 1px solid var(--border); white-space: nowrap; }
.e-flag { display: inline-grid; place-items: center; height: 18px; min-width: 26px; padding: 0 4px; border-radius: 4px; font-family: var(--mono); font-size: 10.5px; font-weight: 600; color: var(--text-2); border: 1px solid var(--border-2); letter-spacing: .03em; }
.e-kbd { font-family: var(--mono); font-size: 11px; line-height: 16px; padding: 0 5px; border-radius: 4px; border: 1px solid var(--border-2); background: var(--elev); color: var(--text-2); }
.e-dot { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none; }
.e-dot.is-pulse { animation: e-pulse 1.6s ease-in-out infinite; }
.e-copy { border: 0; background: transparent; color: var(--muted); padding: 2px; border-radius: 4px; cursor: pointer; display: inline-grid; place-items: center; }
.e-copy:hover { color: var(--text); background: var(--hover); }

/* ---------- banners ---------- */
.e-banner { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--border-2); background: var(--surface); color: var(--text); }
.e-banner > .ic { margin-top: 2px; }
.e-banner.s-crit, .e-banner.s-warn, .e-banner.s-ok, .e-banner.s-info, .e-banner.s-accent { color: var(--text); }
.e-banner.s-crit > .ic { color: var(--crit); } .e-banner.s-warn > .ic { color: var(--warn); } .e-banner.s-ok > .ic { color: var(--ok); } .e-banner.s-info > .ic { color: var(--info); } .e-banner.s-accent > .ic { color: var(--accent); }
.e-banner-t { font-weight: 600; font-size: 13px; }
.e-banner-b { color: var(--text-2); font-size: 13px; }

/* ---------- tables ---------- */
.e-table-wrap { overflow: auto; }
.e-table { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.e-table th { height: 38px; padding: 0 12px; text-align: left; font-size: 12px; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--border); white-space: nowrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
.e-table td { height: 46px; padding: 0 12px; border-bottom: 1px solid var(--border); white-space: nowrap; vertical-align: middle; }
.e-table th:first-child, .e-table td:first-child { padding-left: 16px; }
.e-table th:last-child, .e-table td:last-child { padding-right: 16px; }
.e-table tbody tr { cursor: pointer; }
.e-table tbody tr:hover td { background: var(--hover); }
.e-table tbody tr.is-sel td { background: var(--accent-bg); }
.e-table tbody tr.is-open td { background: var(--elev); }
.e-table tbody tr:last-child td { border-bottom: 0; }
.e-table .is-num { text-align: right; font-variant-numeric: tabular-nums; }
.e-th-btn { border: 0; background: transparent; padding: 0; color: inherit; font: inherit; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; border-radius: 4px; }
.e-th-btn:hover { color: var(--text); }
.e-th-btn.is-on { color: var(--text); }
.e-cell-name { display: flex; flex-direction: column; gap: 1px; min-width: 0; }
.e-cell-name b { font-weight: 500; color: var(--text); }
.e-bulk { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 16px; background: var(--accent-bg); border-bottom: 1px solid var(--accent-line); flex-wrap: wrap; }

/* ---------- tabs ---------- */
.e-tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--border); overflow-x: auto; }
.e-tab { height: 38px; padding: 0 10px; border: 0; background: transparent; color: var(--text-2); font-weight: 500; font-size: 13px; cursor: pointer; position: relative; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px 6px 0 0; }
.e-tab:hover { color: var(--text); }
.e-tab.is-on { color: var(--text); }
.e-tab.is-on::after { content: ""; position: absolute; left: 8px; right: 8px; bottom: -1px; height: 2px; background: var(--accent); border-radius: 2px; }
.e-tab .e-tab-n { font-family: var(--mono); font-size: 11px; color: var(--muted); }

/* ---------- overlays ---------- */
.e-drawer { position: absolute; top: 0; right: 0; bottom: 0; width: min(540px, 92%); background: var(--surface); border-left: 1px solid var(--border-2); box-shadow: var(--shadow); z-index: 30; display: flex; flex-direction: column; animation: e-slide .2s cubic-bezier(.2,.8,.2,1); }
.e-drawer-h { padding: 16px 18px 0; display: flex; flex-direction: column; gap: 12px; border-bottom: 1px solid var(--border); }
.e-drawer-b { flex: 1 1 auto; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 20px; }
.e-drawer-f { padding: 12px 18px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.e-scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; align-items: center; justify-content: center; padding: 24px; animation: e-fade .15s ease-out; }
.e-scrim.is-top { align-items: flex-start; padding-top: 12vh; }
.e-modal { width: min(560px, 100%); max-height: calc(100vh - 48px); overflow: auto; background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow); animation: e-pop .18s cubic-bezier(.2,.8,.2,1); display: flex; flex-direction: column; }
.e-modal-h { padding: 18px 20px 4px; display: flex; align-items: flex-start; gap: 12px; }
.e-modal-b { padding: 12px 20px 20px; display: flex; flex-direction: column; gap: 14px; }
.e-modal-f { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; gap: 8px; justify-content: flex-end; align-items: center; background: var(--elev); border-radius: 0 0 12px 12px; }
.e-menu { position: fixed; z-index: 70; min-width: 220px; padding: 4px; background: var(--elev); border: 1px solid var(--border-2); border-radius: 9px; box-shadow: var(--shadow); animation: e-fade .1s ease-out; display: flex; flex-direction: column; }
.e-menu-h { padding: 6px 8px 4px; }
.e-menu-item { display: flex; align-items: center; gap: 8px; width: 100%; height: 30px; padding: 0 8px; border: 0; background: transparent; border-radius: 6px; color: var(--text); font-size: 13px; cursor: pointer; text-align: left; white-space: nowrap; }
.e-menu-item:hover, .e-menu-item:focus-visible { background: var(--press); box-shadow: none; }
.e-menu-item .ic { color: var(--text-2); }
.e-menu-item .e-kbd { margin-left: auto; }
.e-menu-item.is-danger, .e-menu-item.is-danger .ic { color: var(--crit); }
.e-menu-item:disabled { color: var(--muted); cursor: not-allowed; background: transparent; }
.e-menu-sep { height: 1px; background: var(--border); margin: 4px 0; }
.e-catch { position: fixed; inset: 0; z-index: 65; background: transparent; border: 0; cursor: default; }
.e-toasts { position: fixed; right: 20px; bottom: 20px; display: flex; flex-direction: column; gap: 8px; z-index: 80; width: min(380px, calc(100vw - 40px)); }
.e-toast { display: flex; gap: 10px; align-items: flex-start; padding: 12px 12px 12px 14px; border-radius: 10px; background: var(--elev); border: 1px solid var(--border-2); box-shadow: var(--shadow); animation: e-rise .22s cubic-bezier(.2,.8,.2,1); }
.e-toast > .ic { margin-top: 2px; }
.e-tip { position: relative; }
.e-tip:hover::after, .e-tip:focus-visible::after { content: attr(data-tip); position: absolute; bottom: calc(100% + 6px); left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); font-size: 11.5px; font-weight: 500; line-height: 16px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; z-index: 90; pointer-events: none; font-family: var(--font); }
.e-popover { position: absolute; z-index: 45; background: var(--elev); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow); animation: e-fade .12s ease-out; }

/* ---------- code / logs ---------- */
.e-code { font-family: var(--mono); font-size: 12px; line-height: 19px; background: var(--sunken); border: 1px solid var(--border); border-radius: 8px; padding: 12px 14px; white-space: pre; overflow: auto; color: var(--text-2); font-variant-ligatures: none; margin: 0; }
.e-code b { color: var(--text); font-weight: 500; }
.e-log-row { display: grid; grid-template-columns: 92px 70px 118px minmax(0, 1fr) 24px; gap: 12px; align-items: center; min-height: 36px; padding: 0 14px; border: 0; border-bottom: 1px solid var(--border); cursor: pointer; background: transparent; width: 100%; text-align: left; color: var(--text); font-size: 12.5px; }
.e-log-row:hover { background: var(--hover); }
.e-log-row.is-open { background: var(--elev); }
.e-log-row.is-new { animation: e-flash 1.4s ease-out; }
.e-sev { display: inline-flex; align-items: center; gap: 5px; font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .04em; }

/* ---------- route path ---------- */
.e-path { display: flex; flex-direction: column; }
.e-path-step { display: grid; grid-template-columns: 30px minmax(0,1fr) auto; gap: 12px; align-items: center; position: relative; min-height: 56px; }
.e-path-step::before { content: ""; position: absolute; left: 14px; top: 0; bottom: 0; width: 2px; background: var(--border-2); }
.e-path-step:first-child::before { top: 50%; }
.e-path-step:last-child::before { bottom: 50%; }
.e-path-step.ln-ok::before { background: var(--ok-line); }
.e-path-step.ln-crit::before { background: repeating-linear-gradient(to bottom, var(--crit) 0 4px, transparent 4px 8px); }
.e-path-step.ln-warn::before { background: var(--warn-line); }
.e-path-node { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--border-2); position: relative; z-index: 1; color: var(--text-2); }

/* ---------- lanes (overview route map) ---------- */
.e-lanes { display: flex; flex-direction: column; }
.e-lane-head, .e-lane { display: grid; grid-template-columns: minmax(170px, 1.25fr) 28px minmax(150px, 1fr) 28px minmax(150px, 1fr) 28px minmax(170px, 1.05fr); align-items: center; }
.e-lane-head { padding: 0 16px 8px; }
.e-lane { padding: 8px 16px; border-top: 1px solid var(--border); }
.e-lane:hover { background: var(--hover); }
.e-lane-cell { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: var(--elev); cursor: pointer; text-align: left; color: var(--text); min-height: 44px; }
.e-lane-cell:hover { border-color: var(--border-2); }
.e-lane-link { height: 2px; position: relative; background: var(--border-2); }
.e-lane-link.ok { background: var(--ok); opacity: .7; }
.e-lane-link.warn { background: var(--warn); }
.e-lane-link.crit { background: repeating-linear-gradient(to right, var(--crit) 0 4px, transparent 4px 7px); }
.e-lane-link.idle { background: var(--border-2); }
.e-lane-link::after { content: ""; position: absolute; right: -1px; top: -3px; border: 4px solid transparent; border-left: 5px solid; border-right: 0; color: inherit; }
.e-lane-link.ok::after { border-left-color: var(--ok); } .e-lane-link.warn::after { border-left-color: var(--warn); } .e-lane-link.crit::after { border-left-color: var(--crit); } .e-lane-link.idle::after { border-left-color: var(--border-2); }
.e-lane-x { position: absolute; left: 50%; top: 50%; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--surface); border: 1px solid var(--crit); color: var(--crit); display: grid; place-items: center; z-index: 1; }

/* ---------- guarantees ---------- */
.e-guar { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 1px; background: var(--border); border-radius: 9px; overflow: hidden; border: 1px solid var(--border); }
.e-guar > div { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.e-guar-v { display: flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 500; }
@media (max-width: 1100px) { .e-guar { grid-template-columns: repeat(2, minmax(0, 1fr)); } }

/* ---------- lifecycle ---------- */
.e-life { display: flex; align-items: flex-start; gap: 0; }
.e-life-step { flex: 1 1 0; display: flex; flex-direction: column; align-items: center; gap: 6px; position: relative; text-align: center; min-width: 0; }
.e-life-step::before { content: ""; position: absolute; top: 11px; left: -50%; right: 50%; height: 2px; background: var(--border-2); }
.e-life-step:first-child::before { display: none; }
.e-life-step.is-done::before, .e-life-step.is-cur::before { background: var(--ok-line); }
.e-life-step.is-fail::before { background: var(--crit-line); }
.e-life-dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 1.5px solid var(--border-2); position: relative; z-index: 1; color: var(--muted); }
.is-done > .e-life-dot { border-color: var(--ok); color: var(--ok); background: var(--ok-bg); }
.is-cur > .e-life-dot { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 0 4px var(--accent-bg); }
.is-fail > .e-life-dot { border-color: var(--crit); color: var(--crit); background: var(--crit-bg); }

/* ---------- charts ---------- */
.e-chart { position: relative; height: 180px; margin-left: 44px; }
.e-chart svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.e-gl { stroke: var(--grid); stroke-width: 1; vector-effect: non-scaling-stroke; }
.e-line { fill: none; stroke-width: 2; vector-effect: non-scaling-stroke; stroke-linejoin: round; stroke-linecap: round; }
.e-line.rx { stroke: var(--s-rx); } .e-line.tx { stroke: var(--s-tx); } .e-line.ok { stroke: var(--ok); } .e-line.crit { stroke: var(--crit); } .e-line.acc { stroke: var(--accent); }
.e-area { stroke: none; }
.e-area.rx { fill: var(--s-rx); opacity: .10; } .e-area.tx { fill: var(--s-tx); opacity: .07; } .e-area.acc { fill: var(--accent); opacity: .10; }
.e-yax { position: absolute; left: -44px; width: 38px; text-align: right; font-family: var(--mono); font-size: 10.5px; color: var(--muted); transform: translateY(-50%); }
.e-xax { display: flex; justify-content: space-between; margin: 6px 0 0 44px; font-family: var(--mono); font-size: 10.5px; color: var(--muted); }
.e-cross { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--muted); opacity: .6; pointer-events: none; }
.e-cdot { position: absolute; width: 9px; height: 9px; border-radius: 50%; border: 2px solid var(--surface); transform: translate(-50%, -50%); pointer-events: none; }
.e-ctip { position: absolute; top: 4px; padding: 8px 10px; background: var(--elev); border: 1px solid var(--border-2); border-radius: 8px; font-size: 12px; pointer-events: none; box-shadow: var(--shadow); min-width: 168px; z-index: 3; display: flex; flex-direction: column; gap: 4px; }
.e-legend { display: flex; gap: 14px; font-size: 12px; color: var(--text-2); align-items: center; flex-wrap: wrap; }
.e-legend span { display: inline-flex; align-items: center; gap: 6px; }
.e-key { width: 12px; height: 3px; border-radius: 2px; display: inline-block; }
.e-key.rx { background: var(--s-rx); } .e-key.tx { background: var(--s-tx); } .e-key.acc { background: var(--accent); } .e-key.crit { background: var(--crit); } .e-key.ok { background: var(--ok); }
.e-bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; display: flex; gap: 2px; min-width: 60px; }
.e-bar > span { display: block; height: 100%; border-radius: 3px; }
.e-bar .rx { background: var(--s-rx); } .e-bar .tx { background: var(--s-tx); } .e-bar .ok { background: var(--ok); } .e-bar .warn { background: var(--warn); } .e-bar .crit { background: var(--crit); } .e-bar .acc { background: var(--accent); }
.e-spark { width: 100%; height: 28px; display: block; overflow: visible; }

/* ---------- topology ---------- */
.e-topo { position: relative; overflow: hidden; background-color: var(--sunken); background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 22px 22px; border-radius: 12px; border: 1px solid var(--border); cursor: grab; user-select: none; }
.e-topo.is-pan { cursor: grabbing; }
.e-topo-layer { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
.e-topo-tools { position: absolute; left: 12px; bottom: 12px; display: flex; gap: 4px; padding: 4px; background: var(--surface); border: 1px solid var(--border-2); border-radius: 9px; z-index: 4; box-shadow: var(--shadow); align-items: center; }
.e-topo-legend { position: absolute; right: 12px; bottom: 12px; display: flex; gap: 12px; padding: 8px 12px; background: var(--surface); border: 1px solid var(--border-2); border-radius: 9px; z-index: 4; font-size: 11.5px; color: var(--text-2); flex-wrap: wrap; }
.e-col-label { position: absolute; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.e-node { position: absolute; display: flex; align-items: center; gap: 9px; padding: 0 10px 0 8px; height: 50px; width: 200px; border-radius: 10px; background: var(--surface); border: 1px solid var(--border-2); cursor: pointer; text-align: left; color: var(--text); transition: border-color .12s, box-shadow .12s, opacity .15s; }
.e-node:hover { border-color: var(--muted); }
.e-node.is-sel { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.e-node.is-dim { opacity: .35; }
.e-node.t-client { border-style: dashed; background: var(--elev); }
.e-node.t-exit { border-radius: 25px; }
.e-node.t-net { border-radius: 25px; width: 170px; }
.e-node.n-crit { border-color: var(--crit-line); }
.e-node.n-warn { border-color: var(--warn-line); }
.e-node-ic { width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; flex: none; }
.t-client .e-node-ic { background: var(--idle-bg); color: var(--text-2); }
.t-proxy .e-node-ic { background: var(--accent-bg); color: var(--accent); }
.t-profile .e-node-ic { background: var(--info-bg); color: var(--info); }
.t-tunnel .e-node-ic { background: var(--ok-bg); color: var(--ok); }
.t-exit .e-node-ic, .t-net .e-node-ic { background: var(--elev); color: var(--text); border-radius: 50%; border: 1px solid var(--border-2); }
.e-node-t { font-size: 12.5px; font-weight: 600; line-height: 16px; }
.e-node-s { font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 14px; }
.e-node-st { margin-left: auto; flex: none; display: grid; place-items: center; }
.e-ns { position: absolute; border: 1px dashed var(--border-2); border-radius: 14px; pointer-events: none; }
.e-ns.n-crit { border-color: var(--crit-line); }
.e-ns-label { position: absolute; top: -10px; left: 14px; padding: 0 6px; background: var(--sunken); font-family: var(--mono); font-size: 10.5px; color: var(--muted); line-height: 18px; display: flex; gap: 6px; align-items: center; }
.e-edge { fill: none; stroke-width: 1.6; }
.e-edge.ok { stroke: var(--ok); opacity: .55; }
.e-edge.warn { stroke: var(--warn); opacity: .85; }
.e-edge.crit { stroke: var(--crit); stroke-dasharray: 4 5; }
.e-edge.idle { stroke: var(--border-2); stroke-dasharray: 2 4; }
.e-edge.is-hl { stroke-width: 2.6; opacity: 1; }
.e-flow { fill: none; stroke-width: 2; stroke: var(--ok); stroke-dasharray: 2 14; stroke-linecap: round; animation: e-flow 1.1s linear infinite; }
.e-flow.warn { stroke: var(--warn); animation-duration: 2.2s; }
.e-edge-x { position: absolute; width: 20px; height: 20px; margin: -10px 0 0 -10px; border-radius: 50%; background: var(--surface); border: 1.5px solid var(--crit); color: var(--crit); display: grid; place-items: center; z-index: 2; }

/* ---------- wizard ---------- */
.e-wiz { width: min(980px, 100%); height: min(680px, calc(100vh - 48px)); display: grid; grid-template-columns: 248px minmax(0, 1fr); overflow: hidden; padding: 0; }
.e-wiz-rail { background: var(--elev); border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; }
.e-wiz-main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.e-wiz-body { flex: 1 1 auto; overflow: auto; padding: 22px 28px; display: flex; flex-direction: column; gap: 18px; }
.e-step { display: flex; gap: 10px; align-items: flex-start; padding: 9px 10px; border-radius: 8px; color: var(--text-2); border: 0; background: transparent; text-align: left; width: 100%; cursor: pointer; }
.e-step:disabled { cursor: default; }
.e-step.is-cur { background: var(--surface); color: var(--text); box-shadow: inset 0 0 0 1px var(--border-2); }
.e-step-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-family: var(--mono); border: 1px solid var(--border-2); flex: none; background: var(--surface); }
.e-step.is-cur .e-step-n { border-color: var(--accent); color: var(--accent); }
.e-step.is-done .e-step-n { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.e-step.is-fail .e-step-n { background: var(--crit-bg); border-color: var(--crit-line); color: var(--crit); }
.e-opt { display: flex; gap: 12px; padding: 12px 14px; border: 1px solid var(--border-2); border-radius: 10px; background: var(--surface); cursor: pointer; text-align: left; width: 100%; color: var(--text); align-items: flex-start; transition: border-color .12s, background .12s; }
.e-opt:hover { border-color: var(--muted); }
.e-opt.is-on { border-color: var(--accent); background: var(--accent-bg); }
.e-opt:disabled { opacity: .5; cursor: not-allowed; }
.e-checkrow { display: grid; grid-template-columns: 26px minmax(0, 1fr) auto; gap: 12px; align-items: start; padding: 13px 0; border-bottom: 1px solid var(--border); }
.e-checkrow:last-child { border-bottom: 0; }
.e-check-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; border: 1.5px solid var(--border-2); color: var(--muted); }
.e-check-ic.s-ok { border-color: var(--ok); }
.e-check-ic.s-crit { border-color: var(--crit); }
.e-check-ic.s-warn { border-color: var(--warn); }
.e-check-ic.s-accent { border-color: var(--accent); }

/* ---------- empty / loading ---------- */
.e-empty { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 10px; padding: 56px 24px; }
.e-empty-ic { width: 48px; height: 48px; border-radius: 12px; border: 1px dashed var(--border-2); display: grid; place-items: center; color: var(--text-2); background: var(--elev); margin-bottom: 4px; }
.e-skel { background: linear-gradient(90deg, var(--elev) 0%, var(--press) 50%, var(--elev) 100%); background-size: 200% 100%; animation: e-shimmer 1.3s ease-in-out infinite; border-radius: 6px; }
.e-progress { height: 4px; border-radius: 2px; background: var(--sunken); overflow: hidden; position: relative; }
.e-progress > span { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent); border-radius: 2px; transition: width .3s; }
.e-progress.is-indet > span { width: 35%; animation: e-indet 1.2s ease-in-out infinite; }

/* ---------- settings ---------- */
.e-set-nav { display: flex; flex-direction: column; gap: 1px; width: 230px; flex: none; }
.e-set-row { display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 14px 0; border-bottom: 1px solid var(--border); }
.e-set-row:last-child { border-bottom: 0; }
.e-lock { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; color: var(--text-2); padding: 0 6px; height: 20px; border-radius: 5px; background: var(--elev); border: 1px solid var(--border-2); white-space: nowrap; }

/* ---------- command palette ---------- */
.e-cmd { width: min(640px, 100%); background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; animation: e-pop .15s ease-out; }
.e-cmd-in { display: flex; align-items: center; gap: 10px; padding: 0 16px; border-bottom: 1px solid var(--border); }
.e-cmd-in input { height: 52px; border: 0; background: transparent; font-size: 15px; width: 100%; color: var(--text); }
.e-cmd-in input:focus { box-shadow: none; }
.e-cmd-list { max-height: 380px; overflow: auto; padding: 6px; display: flex; flex-direction: column; gap: 1px; }
.e-cmd-item { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 10px; border-radius: 7px; border: 0; background: transparent; width: 100%; text-align: left; cursor: pointer; color: var(--text); }
.e-cmd-item.is-on, .e-cmd-item:hover { background: var(--press); }
.e-cmd-group { padding: 8px 10px 4px; }

/* ---------- motion ---------- */
@keyframes e-spin { to { transform: rotate(360deg); } }
@keyframes e-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
@keyframes e-flow { to { stroke-dashoffset: -32; } }
@keyframes e-rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes e-slide { from { opacity: .4; transform: translateX(24px); } to { opacity: 1; transform: none; } }
@keyframes e-pop { from { opacity: 0; transform: scale(.98) translateY(4px); } to { opacity: 1; transform: none; } }
@keyframes e-fade { from { opacity: 0; } to { opacity: 1; } }
@keyframes e-shimmer { from { background-position: 100% 0; } to { background-position: -100% 0; } }
@keyframes e-indet { from { left: -35%; } to { left: 100%; } }
@keyframes e-flash { from { background: var(--accent-bg); } to { background: transparent; } }
.ic-spin { transform-box: fill-box; transform-origin: center; }
@media (prefers-reduced-motion: reduce) {
  .e-root *, .e-root *::before, .e-root *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
}

/* ---------- grid tables (div-based, sc-for safe) ---------- */
.e-tbl { display: flex; flex-direction: column; min-width: 0; font-size: 13px; }
.e-tbl-scroll { overflow-x: auto; }
.e-tr { display: grid; align-items: center; column-gap: 10px; padding: 0 16px; min-height: 48px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; }

.e-tr.is-open { background: var(--elev); }
.e-th { min-height: 38px; cursor: default; font-size: 12px; font-weight: 500; color: var(--muted); position: sticky; top: 0; background: var(--surface); z-index: 1; border-bottom: 1px solid var(--border) !important; }
.e-th:hover { background: var(--surface); }
.e-td { min-width: 0; display: flex; align-items: center; gap: 6px; white-space: nowrap; overflow: hidden; }
.e-td.is-num { justify-content: flex-end; text-align: right; font-variant-numeric: tabular-nums; }
.e-compact .e-tr { min-height: 40px; }
.e-compact .e-tr:not(.e-th) .e-tag { height: 18px; }
.e-rowbtn { border: 0; background: transparent; padding: 0; text-align: left; cursor: pointer; color: inherit; display: flex; flex-direction: column; gap: 2px; min-width: 0; border-radius: 4px; max-width: 100%; }
.e-rowbtn:hover > :first-child { text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--muted); }
.e-xrow { padding: 12px 16px 14px 32px; background: var(--elev); border-bottom: 1px solid var(--border); }
.e-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- key / value rows ---------- */
.e-kvl { display: flex; flex-direction: column; }
.e-kvr { display: grid; grid-template-columns: minmax(110px, 36%) minmax(0, 1fr); gap: 16px; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 13px; align-items: baseline; }
.e-kvr:last-child { border-bottom: 0; }
.e-kvr > span:first-child { color: var(--text-2); }

/* ---------- overview ---------- */
.e-ovgrid { display: grid; grid-template-columns: minmax(0, 1.7fr) minmax(320px, 1fr); gap: 16px; align-items: start; }
@media (max-width: 1320px) { .e-ovgrid { grid-template-columns: minmax(0, 1fr) !important; } }
.e-al { display: flex; gap: 12px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--border); }
.e-al:first-child { border-top: 0; }
.e-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(150px, 100%), 1fr)); gap: 16px; padding-top: 14px; border-top: 1px solid var(--border); }
.e-lane-st { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; line-height: 16px; font-weight: 500; white-space: nowrap; }
.e-tl { display: flex; flex-direction: column; }
.e-tl-i { display: grid; grid-template-columns: 62px 20px minmax(0, 1fr); gap: 10px; align-items: start; padding: 7px 0; position: relative; }
.e-tl-i::before { content: ""; position: absolute; left: 81px; top: 27px; bottom: -6px; width: 1px; background: var(--border); }
.e-tl-i:last-child::before { display: none; }
.e-tl-dot { width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); position: relative; z-index: 1; }
.e-chain { display: flex; align-items: stretch; gap: 10px; flex-wrap: wrap; }

.e-chain-i { flex: 1 1 150px; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--elev); min-width: 0; }
.e-chain-i .e-node-ic { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; }
.e-bell-n { position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--crit); color: var(--bg); font-size: 10px; font-weight: 700; display: grid; place-items: center; padding: 0 4px; font-family: var(--mono); line-height: 1; }
.e-tile.is-static { cursor: default; }
.e-tile.is-static:hover { background: var(--surface); }
.e-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(480px, 100%), 1fr)); gap: 16px; }
.e-pcard-crit { border-color: var(--crit-line); }
.e-ipgrid { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 980px) { .e-ipgrid { grid-template-columns: minmax(0, 1fr); } }

/* ---------- topology layout ---------- */
.e-topo-wrap { display: flex; gap: 16px; height: calc(100vh - 210px); min-height: 520px; }
.e-topo-wrap > .e-topo { flex: 1 1 auto; min-width: 0; }
.e-topo-side { width: 316px; flex: none; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
@media (max-width: 1180px) { .e-topo-side { width: 270px; } }
@media (max-width: 860px) { .e-topo-wrap { flex-direction: column; height: auto; } .e-topo-wrap > .e-topo { height: 520px; } .e-topo-side { width: auto; } }
.e-edge-svg { position: absolute; left: 0; top: 0; overflow: visible; pointer-events: none; }
.e-edge.is-dim { opacity: .1; }
.e-key-dash { width: 14px; height: 0; border-top: 2px dashed var(--crit); display: inline-block; }
.e-calm .e-flow { display: none; }
.e-calm .is-pulse { animation: none; }

/* ---------- logs & drawers ---------- */
.e-mlog { display: grid; grid-template-columns: 62px 52px minmax(0, 1fr); gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--border); align-items: baseline; }
.e-log-head { cursor: default; min-height: 32px; font-size: 11.5px; color: var(--muted); font-weight: 500; }
.e-log-head:hover { background: transparent; }
.e-main > .e-drawer { top: 56px; }
.e-alpop { top: 60px; right: 16px; width: 420px; max-width: calc(100vw - 32px); padding: 0; }

/* ---------- dialogs & wizard ---------- */
.e-drop { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 28px; border: 1.5px dashed var(--border-2); border-radius: 12px; background: var(--sunken); cursor: pointer; color: var(--text); width: 100%; }
.e-drop:hover { border-color: var(--accent); }
.e-result { display: flex; gap: 14px; align-items: flex-start; padding: 16px; border-radius: 12px; border: 1px solid var(--border-2); }
.e-result.s-ok { border-color: var(--ok-line); background: var(--ok-bg); color: var(--text); }
.e-result.s-crit { border-color: var(--crit-line); background: var(--crit-bg); color: var(--text); }
.e-wiz-note { display: flex; gap: 8px; align-items: flex-start; padding: 10px; border-radius: 8px; background: var(--surface); border: 1px solid var(--border); }
.e-sw-t { font-weight: 600; font-size: 13px; }
.e-set-row > .e-col { gap: 2px; }
@media (max-width: 820px) { .e-wiz { grid-template-columns: minmax(0, 1fr); height: auto; } .e-wiz-rail { display: none; } }

/* ==========================================================================
   v1.1 — workstation refinements
   ========================================================================== */
.e-cap { font-size: 12px; line-height: 17px; }
.e-mono-s { font-size: 12px; }
.e-btn.is-on { background: var(--accent-bg); color: var(--accent); border-color: var(--accent-line); }

/* window chrome, UI scale, desktop simulation */
.e-root { --chrome-h: 32px; --z: 1; }
.e-z90 { --z: .9; } .e-z110 { --z: 1.1; } .e-z125 { --z: 1.25; }
.e-wrest { --chrome-h: 120px; }
.e-desk { position: relative; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.e-win { display: flex; flex-direction: column; min-height: 0; flex: 1 1 auto; background: var(--bg); }
.e-app { height: calc((100vh - var(--chrome-h)) / var(--z)); min-height: 0; zoom: var(--z); }
@media (max-width: 760px) { .e-app { height: auto; } .e-desk { height: auto; } }
.e-scrim > *, .e-toasts { zoom: var(--z); }
.e-titlebar { display: flex; align-items: center; height: 32px; flex: 0 0 32px; padding-left: 12px; background: var(--sidebar); border-bottom: 1px solid var(--border); gap: 10px; font-size: 12px; color: var(--text-2); user-select: none; }
.e-titlebar .e-brand-mark { width: 18px; height: 18px; border-radius: 5px; }
.e-wbtn { width: 46px; height: 32px; border: 0; background: transparent; color: var(--text-2); display: grid; place-items: center; cursor: pointer; border-radius: 0; }

.e-deskbg .e-desk { background-color: var(--sunken); background-image: radial-gradient(var(--grid) 1px, transparent 1.2px); background-size: 24px 24px; }
.e-wrest .e-desk { padding: 24px 48px 64px; }
.e-wrest .e-win { border: 1px solid var(--border-2); border-radius: 10px; overflow: hidden; box-shadow: 0 24px 64px rgba(0,0,0,.42); }
.e-wmin .e-win, .e-wtray .e-win, .e-wquit .e-win { display: none; }
.e-taskbar { position: absolute; left: 0; right: 0; bottom: 0; height: 44px; background: var(--sidebar); border-top: 1px solid var(--border-2); display: flex; align-items: center; padding: 0 12px; gap: 6px; z-index: 6; }
.e-tb-app { position: relative; height: 36px; padding: 0 12px; border-radius: 7px; border: 0; background: transparent; color: var(--text); display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 12.5px; }
.e-tb-app:hover { background: var(--hover); }
.e-tb-app.is-on::after { content: ""; position: absolute; left: 30%; right: 30%; bottom: 2px; height: 3px; border-radius: 2px; background: var(--accent); }
.e-tray-ic { position: relative; width: 34px; height: 34px; border-radius: 7px; border: 0; background: transparent; color: var(--text); display: grid; place-items: center; cursor: pointer; }
.e-tray-ic:hover, .e-tray-ic.is-on { background: var(--hover); }
.e-tray-ic .e-dot { position: absolute; right: 5px; bottom: 6px; width: 7px; height: 7px; border: 1.5px solid var(--sidebar); box-sizing: content-box; }
.e-traypop { position: absolute; right: 12px; bottom: 54px; width: 360px; max-height: calc(100% - 80px); overflow: auto; z-index: 7; background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow); animation: e-rise .18s ease-out; display: flex; flex-direction: column; }
.e-trayrow { display: grid; grid-template-columns: 16px minmax(0,1fr) auto; gap: 10px; align-items: center; padding: 8px 14px; border-top: 1px solid var(--border); }
.e-osnote { position: absolute; right: 12px; bottom: 54px; width: 360px; z-index: 8; padding: 12px 14px; background: var(--elev); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow); display: flex; gap: 10px; animation: e-rise .2s ease-out; }
.e-deskmsg { margin: auto; width: min(520px, 90%); padding: 28px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border-2); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
.e-deskicon { position: absolute; left: 32px; top: 32px; display: flex; flex-direction: column; align-items: center; gap: 6px; width: 84px; padding: 10px 6px; border-radius: 10px; border: 1px solid transparent; background: transparent; color: var(--text); cursor: pointer; font-size: 12px; }
.e-deskicon:hover { background: var(--hover); border-color: var(--border); }

/* agent */
.e-agent { margin: 8px 12px 4px; display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border); background: transparent; width: calc(100% - 24px); text-align: left; cursor: pointer; color: var(--text-2); }
.e-agent:hover { border-color: var(--border-2); background: var(--hover); }

/* KPI tiles */
.e-tiles-6 { grid-template-columns: repeat(6, minmax(0, 1fr)); }
@media (max-width: 1600px) { .e-tiles-6 { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 860px) { .e-tiles-6 { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.e-tiles-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
@media (max-width: 860px) { .e-tiles-5 { grid-template-columns: minmax(0, 1fr); } }
.e-segs { display: flex; gap: 2px; height: 6px; margin-top: 8px; }
.e-segs > span { flex: 1 1 0; border-radius: 2px; background: var(--border-2); min-width: 4px; }
.e-segs .ok { background: var(--ok); } .e-segs .warn { background: var(--warn); } .e-segs .crit { background: var(--crit); } .e-segs .acc { background: var(--accent); } .e-segs .idle { background: var(--border-2); }

/* incidents */
.e-inc { display: grid; grid-template-columns: 22px minmax(0, 1.35fr) minmax(0, 1.25fr) auto; gap: 16px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--border); }
.e-inc:first-child { border-top: 0; }
@media (max-width: 1180px) { .e-inc { grid-template-columns: 22px minmax(0, 1fr); } .e-inc > :nth-child(n+3) { grid-column: 2; } }
.e-inc-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.e-mchip { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 8px; border-radius: 6px; border: 1px solid var(--border); background: var(--elev); font-size: 11.5px; color: var(--text); cursor: pointer; font-family: var(--mono); white-space: nowrap; }
.e-mchip:hover { border-color: var(--border-2); }

/* tables */
.e-td.is-act { overflow: visible; }
.e-tip.tip-b:hover::after, .e-tip.tip-b:focus-visible::after { bottom: auto; top: calc(100% + 6px); }
.e-tip.tip-l:hover::after, .e-tip.tip-l:focus-visible::after { left: auto; right: 0; transform: none; }
.e-lsegs { display: flex; gap: 2px; width: 100px; }
.e-lsegs > span { height: 4px; flex: 1 1 0; border-radius: 2px; background: var(--border-2); }
.e-lsegs .done { background: var(--ok); } .e-lsegs .cur { background: var(--accent); animation: e-pulse 1.2s ease-in-out infinite; } .e-lsegs .fail { background: var(--crit); }
.e-guar > button { background: var(--surface); padding: 10px 12px; display: flex; flex-direction: column; gap: 4px; min-width: 0; border: 0; text-align: left; cursor: pointer; color: var(--text); }
.e-guar > button:hover { background: var(--elev); }

/* topology v2 */
.e-topo-wrap.is-full { position: absolute; inset: 0; z-index: 25; padding: 12px; height: auto; min-height: 0; background: var(--bg); }
.e-topo-bar { position: absolute; top: 12px; left: 12px; z-index: 4; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; padding: 4px; background: var(--surface); border: 1px solid var(--border-2); border-radius: 9px; box-shadow: var(--shadow); max-width: calc(100% - 380px); cursor: default; }
.e-topo-bar .e-chip { height: 26px; }
.e-topo-panel { position: absolute; top: 12px; right: 12px; bottom: 64px; width: 330px; z-index: 5; display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--border-2); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; cursor: default; animation: e-slide .18s ease-out; }
.e-topo-sum { position: absolute; top: 12px; right: 12px; z-index: 4; display: flex; flex-direction: column; gap: 6px; padding: 10px 12px; width: 220px; background: var(--surface); border: 1px solid var(--border-2); border-radius: 10px; box-shadow: var(--shadow); cursor: default; }
.e-node { height: 52px; }
.e-node-t { font-size: 13px; }
.e-node-s { font-size: 11px; }
.e-node.is-hide, .e-ns.is-hide, .e-edge-x.is-hide { opacity: .05; pointer-events: none; }
.e-edge.is-hide { opacity: .04; }

/* test, recovery, onboarding */
.e-hsteps { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.e-hstep { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 12.5px; font-weight: 500; white-space: nowrap; }
.e-hstep.is-cur { color: var(--text); } .e-hstep.is-done { color: var(--text-2); }
.e-hstep-n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; border: 1px solid var(--border-2); font-family: var(--mono); font-size: 11px; background: var(--surface); }
.is-cur > .e-hstep-n { border-color: var(--accent); color: var(--accent); }
.is-done > .e-hstep-n { background: var(--ok-bg); border-color: var(--ok-line); color: var(--ok); }
.e-hstep-sep { flex: 1 1 20px; height: 1px; background: var(--border-2); min-width: 14px; }
.e-cause { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--crit-line); background: var(--crit-bg); display: flex; gap: 10px; align-items: flex-start; }
.e-cause.is-warn { border-color: var(--warn-line); background: var(--warn-bg); }
.e-wf { display: grid; grid-template-columns: 130px minmax(0, 1fr) 70px; gap: 8px 12px; align-items: center; font-size: 12px; }
.e-wf-bar { height: 10px; position: relative; background: var(--sunken); border-radius: 3px; }
.e-wf-bar > span { position: absolute; top: 0; bottom: 0; border-radius: 3px; background: var(--accent); }
.e-snip { position: relative; }
.e-snip > .e-copy { position: absolute; top: 8px; right: 8px; background: var(--surface); border: 1px solid var(--border); padding: 4px; }
.e-code.is-wrap { white-space: pre-wrap; word-break: break-all; }
.e-rec { width: min(760px, 100%); }
.e-ob { display: grid; grid-template-columns: 260px minmax(0, 1fr); min-height: 420px; }
.e-ob-rail { border-right: 1px solid var(--border); padding: 20px 14px; display: flex; flex-direction: column; gap: 4px; background: var(--elev); border-radius: 12px 0 0 12px; }
.e-ob-main { padding: 24px 28px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
@media (max-width: 900px) { .e-ob { grid-template-columns: minmax(0, 1fr); } .e-ob-rail { display: none; } }
.e-agrid { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: 420px; }
.e-agrid > :first-child { border-right: 1px solid var(--border); padding: 12px; display: flex; flex-direction: column; gap: 6px; background: var(--elev); }
@media (max-width: 760px) { .e-agrid { grid-template-columns: minmax(0, 1fr); } }
.e-cards { grid-template-columns: repeat(auto-fill, minmax(min(640px, 100%), 1fr)); }
.e-topo-wrap { height: calc((100vh - var(--chrome-h)) / var(--z) - 234px); min-height: 480px; }
.e-topo-wrap.is-full { height: auto; }
.e-topo-legend { right: 12px; bottom: 12px; }
.e-node { width: 210px; }
.e-node.t-net { width: 170px; }
.e-node-t { font-size: 14px; line-height: 18px; }
.e-node-s { font-size: 11.5px; }
.e-topo-bar { max-width: calc(100% - 24px); }
.e-topo.has-panel .e-topo-bar { max-width: calc(100% - 372px); }
.e-root:focus { outline: none; }
